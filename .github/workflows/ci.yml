name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: main
        type: string

concurrency:
  group: manual-${{ github.workflow }}-${{ inputs.ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout SaneUI
        uses: actions/checkout@v4
        with:
          repository: sane-apps/SaneUI
          path: SaneUI

      - name: Link SaneUI into expected monorepo path
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/../../infra"
          rm -rf "${GITHUB_WORKSPACE}/../../infra/SaneUI"
          ln -s "${GITHUB_WORKSPACE}/SaneUI" "${GITHUB_WORKSPACE}/../../infra/SaneUI"

      - name: Run verify
        run: ./scripts/SaneMaster.rb verify --quiet
