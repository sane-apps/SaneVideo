AllCops:
  NewCops: enable
  TargetRubyVersion: 2.6
  Exclude:
    - 'scripts/SaneMaster.rb'  # Bash wrapper with .rb extension

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Layout/LineLength:
  Max: 160

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# RuboCop bug (1.82.1): can crash while inspecting certain nested conditionals.
# See pre-commit failure: Style/SoleNestedConditional on Scripts/sanemaster/hooks/process_enforcer.rb.
Style/SoleNestedConditional:
  Enabled: false

# The Scripts/ tooling includes top-level DSL-like Ruby and hook/test harnesses where
# some RuboCop style cops are more noise than signal. Keep these disabled so pre-commit
# doesn’t block commits on non-production Ruby style concerns.
Lint/ShadowedException:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Style/MixinUsage:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Style/SafeNavigationChainLength:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Style/GlobalVars:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false
