name: SaneVideo
options:
  bundleIdPrefix: com.sanevideo
  deploymentTarget:
    macOS: 15.0
  xcodeVersion: 16.0
configs:
  Debug: debug
  Release: release
  Release-AppStore: release
settings:
  # Recommended Xcode settings
  DEAD_CODE_STRIPPING: YES
  SWIFT_EMIT_LOC_STRINGS: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  # Enable recommended warnings (Xcode recommended settings)
  CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
  CLANG_WARN_BOOL_CONVERSION: YES
  CLANG_WARN_COMMA: YES
  CLANG_WARN_CONSTANT_CONVERSION: YES
  CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
  CLANG_WARN_EMPTY_BODY: YES
  CLANG_WARN_ENUM_CONVERSION: YES
  CLANG_WARN_INFINITE_RECURSION: YES
  CLANG_WARN_INT_CONVERSION: YES
  CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
  CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
  CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
  CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
  CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
  CLANG_WARN_STRICT_PROTOTYPES: YES
  CLANG_WARN_SUSPICIOUS_MOVE: YES
  CLANG_WARN_UNREACHABLE_CODE: YES
  CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
  ENABLE_STRICT_OBJC_MSGSEND: YES
  GCC_NO_COMMON_BLOCKS: YES
  GCC_WARN_64_TO_32_BIT_CONVERSION: YES
  GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
  GCC_WARN_UNDECLARED_SELECTOR: YES
  GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
  GCC_WARN_UNUSED_FUNCTION: YES
  GCC_WARN_UNUSED_VARIABLE: YES
  # Hardened runtime for app security
  ENABLE_HARDENED_RUNTIME: YES
packages:
  SaneUI:
    path: ../../infra/SaneUI
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.8.1
schemes:
  SaneVideo:
    build:
      targets:
        SaneVideo: all
        SaneVideoTests: [test]
    frameworks:
      - framework: AVFoundation
      - framework: CoreMedia
      - framework: Speech
      - framework: Vision
      - framework: FoundationModels
      - framework: VideoToolbox
    test:
      gatherCoverageData: true
      targets:
        - SaneVideoTests
    profile:
      config: Release
    run:
      config: Debug
    archive:
      config: Release
targets:
  SaneVideo:
    type: application
    platform: macOS
    bundleId: com.sanevideo.app
    deploymentTarget:
      macOS: 15.0
    sources:
      - path: SaneVideo
        excludes:
          - "**/CLAUDE.md"
    settings:
      base:
        INFOPLIST_FILE: SaneVideo/Info.plist
        PRODUCT_NAME: SaneVideo
        PRODUCT_BUNDLE_IDENTIFIER: com.sanevideo.app
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 6.2
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: 15.0
        ARCHS: arm64
        VALID_ARCHS: arm64
        MTL_ENABLE_APPLE_SILICON_ONLY_OPTIMIZATIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        # Enforce recommended settings
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Code coverage for testing
        ENABLE_CODE_COVERAGE: YES
        GCC_GENERATE_TEST_COVERAGE_FILES: YES
        # Suppress CIColorKernel deprecation warnings (GLSL kernels deprecated since macOS 10.14)
        # Modern replacement would be Metal-based CIKernel, but requires significant refactor
        # This is acceptable as the functionality still works correctly
        GCC_PREPROCESSOR_DEFINITIONS: CI_SILENCE_GL_DEPRECATION=1
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: SaneVideo/SaneVideo.debug.entitlements
        Release:
          DEVELOPMENT_TEAM: M78L6FXD48
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: SaneVideo/SaneVideo.entitlements
        Release-AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.sanevideo.app
          DEVELOPMENT_TEAM: M78L6FXD48
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: SaneVideo/SaneVideo-AppStore.entitlements
          OTHER_SWIFT_FLAGS: "-D APP_STORE"
    preCompileScripts:
      - script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftformat >/dev/null; then
            swiftformat .
          else
            echo "warning: SwiftFormat not installed"
          fi
        name: SwiftFormat Auto-fix
        basedOnDependencyAnalysis: false
    dependencies:
      - package: SaneUI
      - package: argmax-oss-swift
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    postCompileScripts:
      - script: |
          if which swiftlint >/dev/null; then
            swiftlint "${SRCROOT}/SaneVideo" || true
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: Run SwiftLint
        basedOnDependencyAnalysis: false
      - script: |
          if [ "$CONFIGURATION" == "Release-AppStore" ]; then
            echo "Replacing Sparkle with empty stub for App Store build..."
            SPARKLE_FW="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
            if [ -d "${SPARKLE_FW}" ]; then
              # Preserve Info.plist before nuking
              PLIST_TMP="/tmp/sparkle_info_$$.plist"
              cp "${SPARKLE_FW}/Versions/B/Resources/Info.plist" "${PLIST_TMP}" 2>/dev/null || true
              # Nuke entire framework (removes nested Updater.app, XPCServices, etc.)
              rm -rf "${SPARKLE_FW}"
              # Recreate clean minimal framework structure
              mkdir -p "${SPARKLE_FW}/Versions/B/Resources"
              # Create stub dylib that satisfies LC_LOAD_DYLIB
              printf 'void __sparkle_stub(void){}\n' | \
                xcrun clang -x c - -dynamiclib \
                  -install_name "@rpath/Sparkle.framework/Versions/B/Sparkle" \
                  -o "${SPARKLE_FW}/Versions/B/Sparkle" 2>/dev/null
              # Restore preserved Info.plist
              if [ -f "${PLIST_TMP}" ]; then
                mv "${PLIST_TMP}" "${SPARKLE_FW}/Versions/B/Resources/Info.plist"
              fi
              # Create required framework symlinks
              ln -sfn B "${SPARKLE_FW}/Versions/Current"
              ln -sfn Versions/Current/Sparkle "${SPARKLE_FW}/Sparkle"
              ln -sfn Versions/Current/Resources "${SPARKLE_FW}/Resources"
              # Sign: stub binary first, then framework bundle
              /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${SPARKLE_FW}/Versions/B/Sparkle" 2>&1
              /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${SPARKLE_FW}" 2>&1
              echo "Sparkle stubbed successfully"
            fi
            rm -rf "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle_XPCServices.framework" 2>/dev/null || true
          fi
        name: Stub Sparkle (App Store)
        basedOnDependencyAnalysis: false
  SaneVideoTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.sanevideo.SaneVideoTests
    deploymentTarget:
      macOS: 15.0
    sources:
      - path: SaneVideoTests
        excludes:
          - "**/CLAUDE.md"
      - path: Tests/Assets
        namespaced: true
      - path: SaneVideoTests/Mocks
        createIntermediateGroups: true
    settings:
      # Disable dead code stripping for test target to prevent linker errors
      DEAD_CODE_STRIPPING: NO
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: SaneVideo
