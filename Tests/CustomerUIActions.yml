- id: timeline-editing-split-delete-undo
  title: Split at playhead, Delete, and undo edit the timeline without touching files
    on disk
  surfaces:
  - TimelineView
  - TimelineControls split and delete buttons
  - EditorLayoutView Delete key
  - Edit menu Undo and Redo
  steps:
  - Press Command-B to split the clip at the playhead, then undo and redo.
  - Select a clip and press Delete, then undo to put it back.
  - Press the trash button on the timeline toolbar and check it removes the clip from
    the timeline only, and Undo brings it back.
  assertions:
  - Split at playhead divides the clip source range at the playhead and is one undo
    step.
  - The Delete key removes the clip from the project only and is undoable; it never
    deletes the file.
  - Deleting a source file is a separate Delete from Disk command that always asks
    for confirmation first.
  evidence:
  - Source guard for the split shortcut, Delete key binding, toolbar trash button,
    and splitAtPlayhead.
  - Timeline undo/redo and split regression tests.
  required_proof_level: full_runtime_completion
  required_evidence_types:
  - mini_runtime
  - screenshot
  - fixture
  - log
  historical_failure_classes:
