source_rule: Use only actual SaneVideo app captures for public website and App Store screenshots.
website_captures_2026_10_24b:
  replaces: the 2026-10-24 laptop-clip captures and macOS text-to-speech voice (owner found them boring; voice removed)
  build: Release 1.1.1 (12) from main, launched with SANEVIDEO_STORE_SCREENSHOTS=1 SANEVIDEO_OPEN_EDITOR=1, live log attached
  demo_clip: ~/Movies/SaneVideo/ScreenshotKit/Tests/Assets/site-demo-art.mp4 (63.4 s, 1920x1080)
  demo_clip_note: >-
    Composite made to match SaneVideo's bubble spec (VideoWriter.swift bubble(), OverlayModels.swift
    PresenterOverlayLayout radius 16, bottom-right, 40 px margin; drawn 480x320, the standard 320x214 enlarged 1.5x),
    not recorded by SaneVideo. Real Clean Up, captions, export and Create Shorts then ran on it in the app.
  sources:
    camera: >-
      https://www.pexels.com/video/man-sitting-while-talking-4994039/ (Tima Miroshnichenko; Pexels license, free
      commercial use, no attribution required; file 4994039-hd_1920_1080_25fps.mp4, 9.6 MB, downloaded 2026-10-24).
      The speaker never says anything about SaneVideo or video editing.
    screen_paintings_license: Wikimedia Commons, Public Domain Mark 1.0; public domain in the US (published before 1931); downloaded 2026-10-24
    screen_paintings:
      - Hokusai, The Great Wave off Kanagawa, c. 1830-32 (Met) https://commons.wikimedia.org/wiki/File:Tsunami_by_hokusai_19th_century.jpg
      - Van Gogh, The Starry Night, 1889 (MoMA) https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg
      - Monet, Water Lilies, 1906 (Art Institute of Chicago) https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg
      - Vermeer, Girl with a Pearl Earring, c. 1665 (Mauritshuis) https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg
      - Seurat, A Sunday on La Grande Jatte, 1884-86 (Art Institute of Chicago) https://commons.wikimedia.org/wiki/File:A_Sunday_on_La_Grande_Jatte,_Georges_Seurat,_1884.jpg
      - Klimt, The Kiss, 1907-08, oil and gold leaf (Belvedere) https://commons.wikimedia.org/wiki/File:The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg
    voice: >-
      Local Kokoro-82M, voice am_michael (male speaker), speed 1.08, lines joined with 1.6-1.9 s pauses, -16.4 LUFS.
      Script: ~/Movies/SaneVideo/ScreenshotKit/voice/lines.txt (art commentary with two "um"s and one "uh").
  assets:
