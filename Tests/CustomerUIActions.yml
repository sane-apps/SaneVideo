- id: recording-controls-and-hotkeys
  title: Recorder bar controls and the two global hot keys drive the shared recording
    state
  surfaces:
  - RecordingModeView
  - SharedRecordingControls recorder bar
  - UnifiedRecordButton
  - GlobalHotkeyManager
  steps:
  - Check the recorder bar shows the Camera|Screen picker, microphone toggle, camera
    toggle, record button, and pause button.
  - Check Option-Command-R is held only while the recorder is open or a take runs,
    to start and stop recording, and Option-Command-P is held only while recording,
    to pause and resume.
  - Check the Camera|Screen picker can switch sources during a take without leaving
    a timeout task armed.
  assertions:
  - Recorder controls call the shared AppState and RecordingState action paths.
  - Global hot keys use Option-Command only and are released when the recorder is
    closed, so other apps keep those keys the rest of the time.
  - Pause and resume, and switching between camera and screen, keep one continuous
    recording.
  evidence:
  - Source guard for SharedRecordingControls, UnifiedRecordButton, GlobalHotkeyManager,
    and the AppState hot-key wiring.
  - RecordingEngine tests for pause, resume, and source switching without hardware.
