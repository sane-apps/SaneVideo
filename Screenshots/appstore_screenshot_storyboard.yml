product: SaneVideo
audience: Mac creators who need private recording, editing, and export without a subscription.
offer: Local-first video workflow with Basic recording/editing/export and an optional Pro unlock.
primary_proof: Clean Mac screenshots that show varied real footage in populated timeline/editor states without desktop clutter, debug stamps, blank previews, repeated sample subjects, or disabled-feature messaging.
source_rule: Use actual SaneVideo app screenshots only. Fill the editor preview/timeline with stock or fixture video, capture the real app at meaningful timestamps/states, and crop only to remove debug stamps or desktop clutter. Do not create fake UI, color bars, browser mockups, synthetic controls, generated product composites, or feature claims without matching real captures for App Store or launch proof.
generator: scripts/generate_appstore_screenshots.swift
platforms:
  macos:
    - file: Screenshots/appstore-01-editing-dark-mac.png
      title: Edit meeting footage locally
      purpose: Show imported meeting footage, timeline editing, and the visible inspector tools in a populated local project.
      must_show:
        - populated media sidebar
        - preview canvas
        - timeline with clips and playhead
        - inspector tools for polish
      must_not_show:
        - empty states
        - debug controls
        - Finder windows
        - repeated woman-at-laptop fixture
    - file: Screenshots/appstore-02-captions-dark-mac.png
      title: Transcribe captions locally
      purpose: Show a different clip with the real captions/transcription surface active.
      must_show:
        - captions or transcription overlay
        - loaded laptop clip
        - selected clip on the timeline
        - local on-device status
      must_not_show:
        - fake Magic Fix result
        - generated UI
        - build timestamp
        - desktop clutter
        - repeated woman-at-laptop fixture
    - file: Screenshots/appstore-03-review-phone-dark-mac.png
      title: Review phone footage before sharing
      purpose: Show a third, visually distinct clip loaded in the same local editor workflow.
      must_show:
        - populated preview canvas
        - phone footage
        - selected clip on the timeline
        - inspector tools
      must_not_show:
        - blank recording preview
        - export preset claims
        - permission popups
        - repeated woman-at-laptop fixture
